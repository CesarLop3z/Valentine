      /* Fondo con flores o animaciones */
      .flower-background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1; /* Asegura que el fondo esté detrás del mensaje */
        overflow: hidden;

      /* Animación de flores */
      .flower__g-front {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100px;
        height: 100px;
        background-color: pink;
        border-radius: 50%;
        animation: rotateFlower 10s infinite linear;
      }
  
      /* Añade más animaciones de flores o elementos que desees */

        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
      }
  
      /* Mensaje al frente */
      .message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 2rem;
        color: white;
        font-weight: bold;

<div class="message">
  <h1 id="question">¿Quieres ser mi San Valentine? ❤️</h1>
  <div class="button-container">
    <button id="yesButton">Sí</button>
    <button id="noButton">No</button>
  </div>
</div>

<script src="main.js"></script>
<script>
  const yesButton = document.getElementById('yesButton');
  const noButton = document.getElementById('noButton');
  const question = document.getElementById('question'); // Obtén el elemento h1

  // Definir las frases que se usarán para cambiar el texto del título
  const phrases = [
    "Segura?",
    "100% completamente segura?",
    "De acuerdo, ultima oportunidad",
    "POR QUEEE!? 😢",
    "😭😭😭"
  ];

  // Índice para llevar el seguimiento de la frase actual
  let phraseIndex = 0;

  // Aumentar el tamaño del botón "Sí" al hacer clic y cambiar el texto
  yesButton.addEventListener('click', () => {
      // Cambiar el texto del h1
      window.location.href = "contrato.html"; // Cambia a la URL a la que quieres redirigir
  });

  // Mover el botón "No" al pasar el cursor por encima y cambiar el texto secuencialmente
  noButton.addEventListener('mouseenter', () => {
      // Establecer el área del "cubo" más pequeño (200px alrededor del centro de la pantalla)
      const areaSize = 100; // Tamaño del cubo en píxeles

      // Calcular las coordenadas del centro de la pantalla
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      // Generar coordenadas aleatorias dentro del cubo alrededor del centro de la pantalla
      const randomX = Math.floor(Math.random() * areaSize + centerX - areaSize / 2);
      const randomY = Math.floor(Math.random() * areaSize + centerY - areaSize / 2);

      // Asegurarse de que el botón "No" no se salga de la pantalla
      const maxX = window.innerWidth - noButton.offsetWidth;
      const maxY = window.innerHeight - noButton.offsetHeight;

      noButton.style.position = 'absolute';
      noButton.style.left = `${Math.min(Math.max(randomX, 0), maxX)}px`;
      noButton.style.top = `${Math.min(Math.max(randomY, 0), maxY)}px`;

      // Cambiar el texto del título por la siguiente frase
      question.textContent = phrases[phraseIndex]; // Cambiar el texto del h1

      // Actualizar el índice para la siguiente frase
      phraseIndex = (phraseIndex + 1) % phrases.length; // Esto asegura que las frases se repitan en bucle

      // Aumentar el tamaño del botón "Sí"
      const currentSize = parseFloat(window.getComputedStyle(yesButton).fontSize);
      yesButton.style.fontSize = (currentSize + 10) + 'px';
  });

  // No hacer nada al hacer clic en el botón "No"
  noButton.addEventListener('click', (event) => {
      event.preventDefault();
  });
</script>

<style>
  
  button {
    background-color: #FF3366;
    color: white;
    font-size: 18px;
    font-weight: bold;
    padding: 12px 30px;

    border-radius: 30px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);

  }
